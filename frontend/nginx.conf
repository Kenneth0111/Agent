# BaoTa terminates HTTPS and supplies X-Forwarded-Proto; direct local checks use HTTP.
map $http_x_forwarded_proto $creator_forwarded_proto {
    default $scheme;
    https https;
    http http;
}

# Resolve Docker service addresses again after backend containers are replaced.
upstream creator_backend {
    zone creator_backend 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;
    server backend:8080 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://creator_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $creator_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
